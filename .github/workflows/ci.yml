name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-service:
    name: Auth service (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: auth-service/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  business-service:
    name: Business service (ruff, tests with PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: business-service
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: business_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: business_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U business_user -d business_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://business_user:ci_password@localhost:5432/business_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: business-service/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -v

  frontend:
    name: Frontend (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: Docker images and end-to-end smoke test
    needs: [auth-service, business-service, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images and start the stack (test environment)
        run: docker compose up -d --build
      - name: Wait until both APIs are healthy
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3001/health && curl -sf http://localhost:8000/health && curl -sf -o /dev/null http://localhost:5173; then
              exit 0
            fi
            sleep 5
          done
          echo "Services did not become healthy in time" && exit 1
      - name: Run smoke test
        run: ./scripts/smoke-test.sh
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  publish-images:
    name: Publish images to GHCR
    needs: [e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [auth-service, business-service, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          image="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/engine-repair-${{ matrix.service }}"
          docker build -t "$image:${{ github.sha }}" -t "$image:latest" ./${{ matrix.service }}
          docker push "$image:${{ github.sha }}"
          docker push "$image:latest"
